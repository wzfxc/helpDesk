# cp .env.example .env && docker compose up --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Explicit so the api pool (DATABASE_POOL_MAX=20) + LISTEN client + migration pool always fit.
    # statement_timeout is enforced per api connection (DB_STATEMENT_TIMEOUT_MS), not globally,
    # so the seed and migrations are not cut off.
    command: ['postgres', '-c', 'max_connections=100']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    # Loopback only: the database is for local tools (psql, bench), never for the network.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD:-helpdesk}@postgres:5432/${POSTGRES_DB:-helpdesk}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      ATTACHMENTS_DIR: /data/attachments
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_TICKETS: ${SEED_TICKETS:-20000}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-customer123}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-agent123}
      SEED_LEAD_PASSWORD: ${SEED_LEAD_PASSWORD:-lead123}
      SLA_HOLIDAYS: ${SLA_HOLIDAYS:-}
      ENABLE_TEST_HOOKS: ${ENABLE_TEST_HOOKS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
    # Loopback only: browsers reach the api through the web proxy (/api/*), so only local
    # tools (curl, Swagger at /docs) need this port.
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    volumes:
      - attachments:/data/attachments
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  attachments:
