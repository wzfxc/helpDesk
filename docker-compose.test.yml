# Disposable PostgreSQL for integration tests and benchmarks (pnpm db:test:up).
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'max_connections=200']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk -d helpdesk_test']
      interval: 2s
      timeout: 3s
      retries: 30
